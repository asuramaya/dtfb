[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lotstretcher"
version = "0.1.0"
description = "Automated CLI pipeline turning dealership vehicle inventory into AI-enhanced social media posts, hero visuals, and video carousels."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "asuramaya" }]
keywords = ["dealership", "automotive", "facebook-marketplace", "instagram", "social-media", "computer-vision", "clip", "rembg"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Multimedia :: Video",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
]
dependencies = [
    "pillow>=10.0.0",
    "playwright>=1.40.0",
    "requests>=2.31.0",
    "numpy>=1.26.0",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "transformers>=4.30.0",
    # onnxruntime-GPU, not plain onnxruntime -- confirmed real bug this
    # avoids: the CPU-only package has no CUDA execution provider at all
    # (get_available_providers() returns only Azure/CPU), silently running
    # every rembg/BiRefNet cutout on CPU regardless of imaging/cutout.py's
    # own CUDA-library preload workaround, which has nothing to attach to
    # without this package. Measured live: ~10s/cutout on CPU vs ~0.9s
    # warm on GPU once this is installed -- see imaging/cutout.py's
    # _preload_cuda_libs() docstring for the library-path half of this fix.
    "onnxruntime-gpu>=1.16.0",
    "open_clip_torch>=2.20.0",
    "rembg>=2.0.50",
    "imagehash>=4.3.0",
    "spandrel>=0.3.0",
    "scipy>=1.10.0",
    "opencv-python-headless>=4.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-xdist>=3.0",
    "ruff>=0.4.0",
    "mypy>=1.9.0",
]
# CLI mode (the default) needs none of this -- server mode (`lotstretcher-serve`) is
# opt-in so installing lotstretcher to run it as a script doesn't drag in a web
# framework nobody asked for. See src/lotstretcher/server/ for what it's for.
server = [
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "python-multipart>=0.0.9",
]

[project.urls]
Homepage = "https://github.com/asuramaya/lotstretcher"
Repository = "https://github.com/asuramaya/lotstretcher"
Issues = "https://github.com/asuramaya/lotstretcher/issues"

[project.scripts]
lotstretcher = "lotstretcher.cli:main"
compose = "lotstretcher.compose_cli:main"
hero-video = "lotstretcher.hero_video_cli:main"
posts = "lotstretcher.posts_cli:main"
recompose = "lotstretcher.recompose_cli:main"
inventory-sync = "lotstretcher.inventory_sync:main"
export-feed = "lotstretcher.export_feed_cli:main"
spin-video = "lotstretcher.spin_video_cli:main"
lotstretcher-serve = "lotstretcher.server.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lotstretcher = [
    "imaging/templates/*",
    "imaging/calibration/**/*",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = [
    "E501",  # line too long (handled by line-length / formatter)
    "E402",  # module level import not at top of file (lazy imports for heavy cv/dl packages)
    "F401",  # imported but unused (some re-exports and lazy loads)
    "F841",  # local variable assigned but never used
    "F821",  # undefined name (lazy runtime imports like PlaywrightTimeoutError, torch, np in type annotations)
    "E722",  # do not use bare 'except'
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
